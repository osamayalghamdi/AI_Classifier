apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-classifier.fullname" . }}-api
  labels:
    {{- include "ai-classifier.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  # Recreate, not RollingUpdate: two live replicas would double the
  # background workers (sync poller / cluster sweep) during rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ai-classifier.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "ai-classifier.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/env: {{ .Values.api.env | toYaml | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ai-classifier.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "ai-classifier.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            # ── DB wiring (config.py reads PG_*, not DB_*) ──
            - name: PG_HOST
              value: {{ include "ai-classifier.pgHost" . | quote }}
            - name: PG_PORT
              value: {{ include "ai-classifier.pgPort" . | quote }}
            - name: PG_USER
              value: {{ include "ai-classifier.pgUser" . | quote }}
            - name: PG_DATABASE
              value: {{ include "ai-classifier.pgDatabase" . | quote }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.enabled }}
                  name: {{ .Values.postgres.auth.existingSecret }}
                  key: POSTGRES_PASSWORD
                  {{- else }}
                  name: {{ .Values.api.existingSecret }}
                  key: PG_PASSWORD
                  {{- end }}
            # ── Secrets ──
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: LLM_API_KEY
            - name: INTEGRATION_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: INTEGRATION_API_TOKEN
                  optional: true
            - name: TICKETING_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: TICKETING_API_TOKEN
                  optional: true
            # ── Non-secret env from values ──
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # NOTE: the app writes a ".last_sync" poll stamp inside its own
          # package dir → the container filesystem must stay writable.
          # Do NOT set readOnlyRootFilesystem until the app exposes a
          # SYNC_STAMP_PATH env var (see deployment guide, gotcha #3).
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
