apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-classifier.fullname" . }}-backend
  labels:
    {{- include "ai-classifier.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port | default .Values.backend.port }}
      targetPort: http
  selector:
    {{- include "ai-classifier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
