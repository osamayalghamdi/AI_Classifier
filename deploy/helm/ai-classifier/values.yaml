# ── AI Classifier Helm values ─────────────────────────────────────────
# THIS FILE IS THE ONLY CONFIGURATION. There is no .env anywhere in the
# project — not at the repo root, not in backend/. Change a setting here,
# run `helm upgrade`, done; `backend.env` below is what the API reads.
# Secrets are the one exception: they come from a pre-created K8s Secret
# (`existingSecret`), never from this file.
#
# The defaults below are the 100% LOCAL run: the app, its database and the
# models all live on this machine (Ollama serves the models, kind runs the
# cluster). Switching to the customer's network means editing the marked
# lines here and nothing else.
#
# Local run, end to end:
#   docker build -f backend/Dockerfile -t ai_classifier-api:latest backend/
#   docker build -f frontend/Dockerfile -t ai-classifier-frontend:latest frontend/
#   kind load docker-image ai_classifier-api:latest ai-classifier-frontend:latest --name ai-classifier
#   helm upgrade --install ai-classifier deploy/helm/ai-classifier -n ai-classifier
#   kubectl -n ai-classifier port-forward svc/ai-classifier-ai-classifier-frontend 8085:8082
# (A host-side run instead of a pod: `scripts/env-from-chart.sh` exports the
#  same values — one source, two ways to run it.)

image:
  # LOCAL image, loaded into the kind cluster by `kind load docker-image`
  # above — no registry involved.
  repository: ai_classifier-api
  tag: "latest"
  # IfNotPresent: nothing is pulled when the image is already on the node
  # (which is exactly how a kind-loaded image arrives).
  pullPolicy: IfNotPresent

imagePullSecrets: []
#  - name: regcred

# ── API (FastAPI) ─────────────────────────────────────────────────────
backend:
  # Keep 1: the process runs the in-process background workers (sync
  # poller, cluster sweep, integration retry) — >1 replica duplicates them.
  replicas: 1
  port: 8000

  # ══ ENV — the single configuration surface ══════════════════════════
  # Everything the API reads is here, except secrets (`existingSecret`
  # below) and the DB connection (`database.*`). There is no .env in this
  # project: edit this file, `helm upgrade`, and the pod picks it up.
  env:
    # ── LLM — classification ────────────────────────────────────────────
    # LOCAL Ollama (the default run). The API runs in a pod, so it must use
    # the host's LAN address — "localhost" inside a pod is the pod itself.
    # An `ollama/...` LLM_MODEL enables the LOCAL_LLM registry entry on its
    # own; no MODEL_*_ENABLED line is needed (models: `ollama list` — the
    # repo's default is the local classifier-qwen).
    #
    # ── for the customer's network, change these two lines only ──
    #   LLM_MODEL:    "openai/qwen3.6"
    #   LLM_API_BASE: "https://llms.elm.sa/v1"     (key: UNIVERSAL_API_KEY)
    LLM_MODEL: "ollama/classifier-qwen"
    LLM_API_BASE: "http://192.168.1.50:11434"
    LLM_TIMEOUT_S: "120"         # a 7B model on CPU is slow: generous, 0 = provider default
    LLM_PROBE_TIMEOUT_S: "60"    # the /ready + /status ping budget (5s suits a hosted API, not a CPU model)
    LLM_MAX_RETRIES: "3"         # transient only (429/5xx/timeout)
    LLM_RETRY_BASE_S: "2"

    # ── Embeddings — similarity / clustering ────────────────────────────
    # Same local Ollama, OpenAI-compatible /embeddings (bge-m3 is 1024-dim).
    # EMBEDDING_DIM sizes the pgvector column at first startup, so
    # `ollama pull bge-m3` BEFORE the first run.
    EMBEDDING_PROVIDER: "external"
    EMBEDDING_API_URL: "http://192.168.1.50:11434/v1"
    EMBEDDING_MODEL_ID: "bge-m3"
    EMBEDDING_DIM: "1024"
    EMBEDDING_TIMEOUT_S: "30"

    # ── OCR — attachment text (a SEPARATE service, not deployed locally) ─
    # Off by default here: attachments are recorded by name. When the OCR
    # service exists, set OCR_ENABLED=1 and point OCR_SERVICE_URL at it.
    OCR_ENABLED: "0"
    OCR_SERVICE_URL: ""
    OCR_TIMEOUT_S: "60"
    OCR_MAX_ATTACHMENT_MB: "15"
    OCR_MAX_TEXT_CHARS: "20000"

    # ── Attachment understanding — vision reader (external; "" = off) ────
    # URL/model empty = feature off; no provider is ever defaulted. The key
    # comes from `existingSecret`.
    ATTACHMENTS_ENABLED: "0"
    ATTACHMENT_READER_MODE: "vision_llm"
    ATTACHMENT_VISION_API_URL: ""
    ATTACHMENT_VISION_MODEL: ""
    ATTACHMENT_OCR_API_URL: ""
    ATTACHMENT_TIMEOUT_S: "45"
    ATTACHMENT_MAX_PER_TICKET: "5"
    ATTACHMENT_MAX_BYTES: "10485760"
    ATTACHMENT_MAX_PDF_PAGES: "5"
    ATTACHMENT_CONCURRENCY: "2"
    ATTACHMENT_IN_PROMPT: "1"
    ATTACHMENT_LINKING: "0"

    # ── Classification / clustering ──────────────────────────────────────
    SIMILARITY_THRESHOLD: "0.35"
    CLASSIFY_CASCADE_RETRIES: "2"
    CLASSIFY_BATCH_SLEEP_S: "0"
    CLASSIFY_SELF_CONSISTENCY: "false"
    CASCADE_CLASSIFICATION: "true"
    CLUSTER_AUTO_ACTIVATE: "1"
    CLUSTER_ASSIGN_ON_ARRIVAL: "0"
    CLUSTER_AUDIT_INTERVAL_S: "86400"
    RECLASSIFY_ENABLED: "0"
    RECLASSIFY_INTERVAL_S: "600"
    RECLASSIFY_MAX_PER_TICK: "10"
    REPOOL_INTERVAL: "900"

    # ── Integration API — async ingest + retry worker ────────────────────
    INTEGRATION_WORKER_ENABLED: "1"
    INTEGRATION_WRITE_BACK: "0"
    INTEGRATION_MAX_ATTEMPTS: "3"
    INTEGRATION_POLL_S: "5"
    INTEGRATION_RETRY_BASE_S: "2"

    # ── Ticketing seam (SMAX runs as a separate connector process) ───────
    TICKETING_SOURCE: "real"
    TICKETING_API_URL: "http://localhost:8002"
    TICKETING_DRY_RUN: "false"
    SYNC_INTERVAL: "60"
    # SYNC_STAMP_PATH: "/tmp/.last_sync"   # optional: move the poll stamp off the app dir

    # ── Auth / store / CORS ──────────────────────────────────────────────
    AUTH_OPTIONAL: "0"           # 1 = no credential required (testing only)
    STORE_REQUIRED: "1"
    STORE_SETUP_TIMEOUT_S: "120"
    CORS_ALLOW_ORIGINS: "*"

    # ── Import field mapping (which fields hold title / description) ─────
    TICKET_TITLE_FIELDS: "DisplayLabel,display_label,title,Title"
    TICKET_DESCRIPTION_FIELDS: "Description,description,desc"

  # Secrets — created out-of-band, NEVER in values:
  #   LLM_API_KEY, EMBEDDING_API_KEY, ATTACHMENT_VISION_API_KEY,
  #   ATTACHMENT_OCR_API_KEY, INTEGRATION_API_TOKEN, ADMIN_TOKEN,
  #   TICKETING_API_TOKEN.
  # The DB password belongs to the database Secret (database.existingSecret).
  existingSecret: "ai-classifier-secrets"

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"          # no model in the image: the heavy lifting
    limits:                    # (LLM, embeddings) happens on external endpoints
      cpu: "2"
      memory: "5Gi"

  # /ready checks db + embedding + llm; nothing loads locally, so startup is quick.
  probes:
    startup:   { path: /health, failureThreshold: 30, periodSeconds: 10 }
    liveness:  { path: /health, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 4 }
    readiness: { path: /health, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }

  # Recreate, not RollingUpdate: no overlap (would duplicate the workers).
  strategy:
    type: Recreate

  service:
    type: ClusterIP            # ClusterIP | NodePort | LoadBalancer
    port: ""                   # blank → backend.port

# ── Frontend (nginx: dashboard + API proxy) ───────────────────────────
frontend:
  enabled: true
  replicas: 1
  image:
    repository: ai-classifier-frontend
    tag: "latest"
  pullPolicy: IfNotPresent
  port: 8082
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "128Mi" }
  service:
    type: ClusterIP
    port: ""                   # blank → frontend.port

  # nginx config — the whole file body is a value, rendered with `tpl` so
  # chart helpers work inside it. Tune per environment here, not in the chart.
  configMap:
    conf: |
      server {
          listen       {{ .Values.frontend.port }};
          server_name  _;

          root   /usr/share/nginx/html;
          index  index.html;

          location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
          location = / { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

          # Nothing that reveals data or changes state is proxied: the
          # destructive endpoints, the whole /test/ surface and the schema/
          # docs routes are hard-blocked at the proxy. Smoke tests reach the
          # backend Service directly (kubectl port-forward bypasses nginx).
          location = /reset { return 403; }
          location = /test/llm { return 403; }
          location ^~ /test/ { return 403; }
          location = /docs { return 403; }
          location = /redoc { return 403; }
          location = /openapi.json { return 403; }

          location / { try_files $uri $uri/ /index.html; }

          # Liveness/readiness for external probes — up/down only, no data.
          location ~ ^/(health|ready)$ {
              proxy_pass http://{{ include "ai-classifier.fullname" . }}-backend:{{ .Values.backend.port }};
              access_log off;
          }

          # An unlisted path falls through to index.html.
          location ~ ^/(api/|admin/|status|classify|incidents|all-incidents|import|reports|review-queue|cluster-proposals|cluster/|clusters|taxonomy-gaps) {
              proxy_pass http://{{ include "ai-classifier.fullname" . }}-backend:{{ .Values.backend.port }};
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;    # LLM classification can be slow
              client_max_body_size 50m;
          }
      }

# ── OCR — NOT part of this chart ──────────────────────────────────────
# The OCR service is its own deployment (own image, own endpoint, own key).
# Point the API at it with `backend.env.OCR_SERVICE_URL` (+ `OCR_ENABLED`) above.

# ── Database — REQUIRED INFRASTRUCTURE, provided by the platform team ──
# The app needs a database to run; the platform/DB team already runs it
# (provisioning, backups, the pgvector extension, the schema) — it is NOT
# deployed by this chart, and it is NOT a third-party service. The only
# third-party external services are the models (LLM/embeddings/OCR/vision).
# This chart only wires the connection. Requirements on the server they hand over:
#   * reachable from the cluster
#   * `CREATE EXTENSION vector` permitted for the app user (the app
#     creates its own tables at startup)
#   * the password lives in a Secret you create — never in values:
#       kubectl -n <ns> create secret generic ai-classifier-db \
#         --from-literal=PG_PASSWORD='<password>'
database:
  # LOCAL default: the PostgreSQL this cluster already runs (namespace
  # `platform-db`, pgvector installed). For the handover, replace `host`
  # with the server the platform team provides — nothing else changes.
  host: "db.platform-db.svc.cluster.local"
  port: 5432
  name: ai_incidents
  user: aiuser
  existingSecret: "ai-classifier-db"   # key: PG_PASSWORD
  passwordKey: PG_PASSWORD

# ── SMAX connector — a SEPARATE PROCESS, not a pod in this chart ──────
# This is why SMAX has no account here: the app never logs into SMAX. The
# connector does (`python -m integrations.smax.main` from `backend/`), it pushes
# changed tickets into the app's integration API, and it can run on any machine
# that reaches both SMAX and the app. Its settings are split like every other
# credential in this project:
#
#   * the NON-SECRET half lives here, so the configuration still has one home;
#   * the integration ACCOUNT (SMAX_USER / SMAX_PASS) is a credential and can
#     NEVER be in this file — it belongs to the Secret named below, which you
#     create once:
#         kubectl -n ai-classifier create secret generic ai-classifier-smax \
#           --from-literal=SMAX_USER='<integration account>' \
#           --from-literal=SMAX_PASS='<password>'
#
# Then run the connector with this file as its config (the account and the
# app's INTEGRATION_API_TOKEN are read from the Secrets, never typed, never
# written to disk):
#     backend/scripts/smax-from-chart.sh --check      # resolved config, masked
#     backend/scripts/smax-from-chart.sh --probe <id> # one ticket, nothing submitted
#     backend/scripts/smax-from-chart.sh --once       # one real tick, write-back dry
#     backend/scripts/smax-from-chart.sh              # normal operation
smax:
  secrets:
    existingSecret: "ai-classifier-smax"   # keys: SMAX_USER, SMAX_PASS
  env:
    # REQUIRED — the SMAX server. Leave empty until you have the real URL (an
    # empty value fails loudly by name instead of looking configured).
    SMAX_BASE: ""
    SMAX_TENANT: ""                 # TENANTID on the login call
    # The app this connector feeds. A port-forward or a host run both answer on
    # localhost:8000; from another machine, use its address.
    CLASSIFIER_API_URL: "http://localhost:8000"
    # Behaviour (defaults mirror the connector's own documented defaults).
    SMAX_ENTITY_FIELD: "Entity_c"
    SMAX_UTC_OFFSET_HOURS: "3"      # Riyadh
    SMAX_PAGE_SIZE: "250"           # the SMAX API caps at 250
    SMAX_TIMEOUT_S: "120"
    SMAX_TOKEN_TTL_S: "1500"
    SMAX_POLL_S: "60"
    SMAX_MAX_INCIDENTS_PER_TICK: "0"   # set 1 for a first live run
    SMAX_MAX_ATTACHMENT_MB: "15"
    SMAX_DRY_RUN: "true"            # write-back stays log-only (no write endpoint)
    SMAX_WRITE_BACK: "suggestions"
    SMAX_SYNC_STAMP_PATH: "/tmp/.last_sync"

# ── Ingress (EXTERNAL EXPOSURE — opt-in, OFF by default) ──────────────
# Enabling this publishes the app outside the cluster. Only turn it on in an
# environment that is *meant* to be reachable, and pair it with TLS. Left off,
# the app is reachable in-cluster only (smoke tests use `kubectl port-forward`).
# Routing is fixed: everything → the frontend (or the backend when
# frontend.enabled=false).
ingress:
  enabled: false
  className: ""               # e.g. nginx — ask DevOps which controller
  annotations: {}
  #  nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # LLM calls are slow
  host: ai-classifier.example.com
  tls: []
  #  - secretName: ai-classifier-tls
  #    hosts: [ai-classifier.example.com]
