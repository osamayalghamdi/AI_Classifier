services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    # No container_name — lets compose scope names per project, so this
    # stack can coexist with other AI_Classifier instances on one host.
    # Credentials come ONLY from the environment (see .env.example) —
    # never hardcode secrets in compose files.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set it}
      POSTGRES_DB: ${POSTGRES_DB:-ai_incidents}
    # BIND ADDRESS: default 127.0.0.1 — the database is reachable from the
    # host (psql, migrations) but NOT from the LAN/WAN. Set PG_BIND=0.0.0.0
    # only if an external tool must connect directly.
    ports:
      - "${PG_BIND:-127.0.0.1}:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiuser} -d ${POSTGRES_DB:-ai_incidents}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No privilege escalation inside the container (a compromised process
    # cannot gain caps via setuid binaries).
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:   { cpus: "2", memory: "2g" }
        reservations: { cpus: "0.25", memory: "256m" }

  # ── Local LLM runner (Ollama) — OPTIONAL ───────────────────────────
  # Only starts when explicitly requested:  docker compose --profile local-llm up
  # Server deploys use OpenRouter (api service defaults) — this stays down.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    # runtime: nvidia   # uncomment for GPU
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Classification API ─────────────────────────────────────────────
  api:
    build: ./backend
    # BIND ADDRESS: default 127.0.0.1 — the public surface is nginx (:8082,
    # which proxies /api /admin /classify /reports …). Set API_BIND=0.0.0.0
    # to publish the raw API on the LAN again (it is token-gated either way).
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      # LLM backend — all values come from the environment (.env).
      # LLM_API_KEY is required for remote APIs; the app fails loudly on
      # the first LLM call if unset.
      - LLM_MODEL=${LLM_MODEL:-openrouter/qwen/qwen3.6-35b-a3b}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.35}
      # config.py reads PG_* (config.py:59-63), NOT DB_*
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${POSTGRES_USER:-aiuser}
      - PG_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set it}
      - PG_DATABASE=${POSTGRES_DB:-ai_incidents}
      # W3 integration API — bearer token gating every non-health endpoint.
      # Fail-closed: empty ⇒ all integration requests rejected (never a default).
      - INTEGRATION_API_TOKEN=${INTEGRATION_API_TOKEN:-}
      - INTEGRATION_TOKEN=${INTEGRATION_API_TOKEN:-}
      # Separate credential for the admin console. When ADMIN_TOKEN is set,
      # /admin/* accepts ONLY that token, so the SMAX webhook credential no
      # longer opens the console (env writes, DB reset, test runner). Unset =
      # the integration token still works (backward compatible).
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - INTEGRATION_WRITE_BACK=${INTEGRATION_WRITE_BACK:-0}
      - INTEGRATION_MAX_ATTEMPTS=${INTEGRATION_MAX_ATTEMPTS:-3}
      - INTEGRATION_POLL_S=${INTEGRATION_POLL_S:-5}
      - INTEGRATION_RETRY_BASE_S=${INTEGRATION_RETRY_BASE_S:-2}
      # Ticketing seam (W2) — selection + credentials via env only.
      - TICKETING_SOURCE=${TICKETING_SOURCE:-real}
      - TICKETING_API_URL=${TICKETING_API_URL:-http://localhost:8002}
      - TICKETING_API_TOKEN=${TICKETING_API_TOKEN:-}
      - TICKETING_DRY_RUN=${TICKETING_DRY_RUN:-false}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-60}
      # Embeddings — EXTERNAL endpoint, same rule as the LLM and OCR: no
      # model lives in the image. Must return EMBEDDING_DIM values (1024).
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-external}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-bge-m3}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_TIMEOUT_S=${EMBEDDING_TIMEOUT_S:-30}
      # Attachment OCR — its OWN endpoint (a separate OCR deployment, or the
      # bundled one via `docker compose --profile ocr up -d` +
      # OCR_SERVICE_URL=http://ocr:8001). Empty URL = attachments recorded by
      # name only, no OCR calls.
      - OCR_ENABLED=${OCR_ENABLED:-1}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-}
      - OCR_TIMEOUT_S=${OCR_TIMEOUT_S:-60}
      - OCR_MAX_ATTACHMENT_MB=${OCR_MAX_ATTACHMENT_MB:-15}
      # LLM-usage gates — conserve tokens: heal re-classification and
      # per-arrival cluster assignment default OFF (flip to 1 to enable).
      - RECLASSIFY_ENABLED=${RECLASSIFY_ENABLED:-0}
      - CLUSTER_ASSIGN_ON_ARRIVAL=${CLUSTER_ASSIGN_ON_ARRIVAL:-0}
      - CLUSTER_AUDIT_INTERVAL_S=${CLUSTER_AUDIT_INTERVAL_S:-86400}
      # No model is baked into the image: the LLM, the embeddings and the OCR
      # all come from endpoints configured above.
    volumes:
      - ./backend/ai_classification:/app/ai_classification
      # Test-runner support (admin console "Run Tests"): the pytest suite
      # and smoke script run as subprocesses inside the API container.
      - ./backend/tests:/app/tests:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/docs:/app/docs:ro
      - ./backend/smoke_test.sh:/app/smoke_test.sh:ro
      # Admin console writes env-credential changes here (restart required).
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    # No model is resident in this container (embeddings and OCR are remote
    # endpoints), so the limit is headroom for the API process, its ingest
    # worker and the DB round-trips — it stops a runaway classify loop from
    # taking the host down with it.
    deploy:
      resources:
        limits:   { cpus: "2", memory: "5g" }
        reservations: { cpus: "0.5", memory: "3g" }

  # ── OCR Service (OPTIONAL — not started by default) ────────────────
  # The OCR service is a separate part: point the api at whatever hosts it
  # (OCR_SERVICE_URL). This bundled one is a convenience for local work:
  #   docker compose --profile ocr up -d
  #   OCR_SERVICE_URL=http://ocr:8001   (in .env)
  ocr:
    profiles: ["ocr"]
    build: ./backend/ocr
    # BIND ADDRESS: default 127.0.0.1 — nginx reaches the service over the
    # compose network (/ocr); nothing outside the host needs it.
    ports:
      - "${OCR_BIND:-127.0.0.1}:${OCR_PORT:-8001}:8001"
    environment:
      # Company vision model (the supported path). The OCR image ships NO
      # local model, so ELM_API_KEY is required — without it the service
      # refuses to start (clear error in `docker compose logs ocr`).
      - OCR_USE_ELM=${OCR_USE_ELM:-1}
      - ELM_API_URL=${ELM_API_URL:-https://llms.elm.sa/v1/chat/completions}
      - ELM_MODEL=${ELM_MODEL:-openai/qwen3-vl:32b}
      - ELM_API_KEY=${ELM_API_KEY:-}
      - OCR_ELM_TIMEOUT_S=${OCR_ELM_TIMEOUT_S:-60}
      # One long scan must not OOM the container: cap the rendered pages.
      - OCR_MAX_PDF_PAGES=${OCR_MAX_PDF_PAGES:-10}
    healthcheck:
      # No curl in the OCR image — use the always-present Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s   # EasyOCR loads its models on first use
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:   { cpus: "2", memory: "4g" }
        reservations: { cpus: "0.25", memory: "512m" }

  # ── Cloudflare Tunnel (public URL) — OPTIONAL ──────────────────────
  # Only starts when explicitly requested:  docker compose --profile public-tunnel up
  # Exposes nginx (dashboard + API proxy) via trycloudflare.com.
  # URL changes on restart — check logs for the trycloudflare.com link.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public-tunnel"]
    command: tunnel --url http://localhost:8082 --protocol http2
    network_mode: host
    restart: unless-stopped
    depends_on:
      - nginx

  # ── Nginx — serves dashboard + proxies API ─────────────────────────
  nginx:
    image: nginx:alpine
    # The ONE intentionally public port: dashboard + the API proxy in front of
    # it. Everything else in this file binds to 127.0.0.1 by default.
    ports:
      - "${NGINX_PORT:-8082}:8082"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dashboard:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:   { cpus: "0.5", memory: "256m" }
        reservations: { cpus: "0.05", memory: "32m" }

volumes:
  pgdata:
  ollama_data:
