services:
  # ── Local LLM runner (Ollama) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Classification API ─────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_MODEL=ollama/qwen2.5:7b
      - LLM_API_BASE=http://ollama:11434
      - SIMILARITY_THRESHOLD=0.35
      - DB_PATH=/data/incidents.db
    volumes:
      - incidents_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:
  incidents_data:
