services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    # No container_name — lets compose scope names per project, so this
    # stack can coexist with other AI_Classifier instances on one host.
    environment:
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
      POSTGRES_DB: ai_incidents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d ai_incidents"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Local LLM runner (Ollama) — OPTIONAL ───────────────────────────
  # Only starts when explicitly requested:  docker compose --profile local-llm up
  # Server deploys use OpenRouter (api service defaults) — this stays down.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    # runtime: nvidia   # uncomment for GPU
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Classification API ─────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # OpenRouter by default (no Ollama dependency). LLM_API_KEY comes
      # from .env (required for OpenRouter — the app fails on first LLM
      # call if unset).
      - LLM_MODEL=${LLM_MODEL:-openrouter/qwen/qwen3.6-35b-a3b}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SIMILARITY_THRESHOLD=0.35
      # config.py reads PG_* (config.py:59-63), NOT DB_*
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=aiuser
      - PG_PASSWORD=aipass
      - PG_DATABASE=ai_incidents
      - USE_LLM_RERANKING=${USE_LLM_RERANKING:-1}
    volumes:
      - ./ai_classification:/app/ai_classification
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── OCR Service (EasyOCR) ──────────────────────────────────────────
  ocr:
    build: ocr
    ports:
      - "8001:8001"
    restart: unless-stopped

  # ── Cloudflare Tunnel (public URL) — OPTIONAL ──────────────────────
  # Only starts when explicitly requested:  docker compose --profile public-tunnel up
  # Exposes nginx (dashboard + API proxy) via trycloudflare.com.
  # URL changes on restart — check logs for the trycloudflare.com link.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public-tunnel"]
    command: tunnel --url http://localhost:8082 --protocol http2
    network_mode: host
    restart: unless-stopped
    depends_on:
      - nginx

  # ── Nginx — serves dashboard + proxies API ─────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8082:8082"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
