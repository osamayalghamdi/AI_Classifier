services:
  # ── Local LLM runner (Ollama) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Classification API ─────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_MODEL=ollama/qwen2.5:0.5b
      - LLM_API_BASE=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
