services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai_pg
    environment:
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
      POSTGRES_DB: ai_incidents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d ai_incidents"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
