<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Service Ops — Incident Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0C10; --surface: #0F1218; --surface2: #151923; --surface-hover: #151923;
  --border: #1E232C; --border-input: #2A3040; --bg-input: #12151C;
  --text: #F2F4F8; --text-dim: #A7AEBD; --text-faint: #6B7280;
  --accent: #1E6FD9; --accent-dim: rgba(30,111,217,.14);
  --crit: #F0526B; --crit-bg: rgba(240,82,107,.14);
  --major: #F26B21; --major-bg: rgba(242,107,33,.14);
  --minor: #33D17A; --minor-bg: rgba(51,209,122,.12);
  --cosm: #8B949E; --cosm-bg: rgba(139,148,158,.12);
  --gold: #d4a72c;
  --navy: #0c1d46; --elm-blue: #0070c7; --elm-orange: #f16845;
  --pill-bg: #1A1F29; --pill-text: #C3C9D6;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter','IBM Plex Sans Arabic',system-ui,sans-serif; font-size: 14px; line-height: 1.45; }
[lang-ar] { font-family: 'IBM Plex Sans Arabic','Inter',sans-serif; direction: rtl; display: inline-block; }
button { font-family: inherit; cursor: pointer; }

/* ── Header ── */
.topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,12,16,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.topbar-inner { max-width: 1240px; margin: 0 auto; padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.logo-img { height: 26px; width: auto; display: block; }
.logo-name { color: var(--text); white-space: nowrap; }
.logo-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg,#4C8DFF,#7C6CF0); display: grid; place-items: center; font-size: 13px; }
.role-switch { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 3px; gap: 2px; }
.role-btn { background: transparent; border: none; color: var(--text-dim); padding: 5px 13px; border-radius: 5px; font-size: 12.5px; font-weight: 600; transition: all .15s; }
.role-btn:hover { color: var(--text); }
.role-btn.active { background: var(--accent-dim); color: var(--accent); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-faint); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--minor); box-shadow: 0 0 6px var(--minor); }
.live-dot.off { background: var(--crit); box-shadow: none; }
.src-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; }
.src-toggle:hover { color: var(--text); border-color: var(--accent); }
.app-link { background: var(--accent-dim); border: 1px solid transparent; color: var(--accent); border-radius: 6px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; text-decoration: none; }
.app-link:hover { background: var(--accent); color: #fff; }

/* ── Layout ── */
.wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 60px; }
.view { display: none; animation: fade .18s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── Summary header line ── */
.headline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.headline h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.headline h1 b { color: var(--accent); }
.headline h1 .hl-crit { color: var(--crit); }
.subline { color: var(--text-dim); font-size: 12.5px; margin-bottom: 18px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.subline .who { color: var(--text); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.chip.crit { background: var(--crit-bg); color: var(--crit); }
.chip.major { background: var(--major-bg); color: var(--major); }
.chip.minor { background: var(--minor-bg); color: var(--minor); }
.chip.neutral { background: var(--pill-bg); color: var(--pill-text); border: 1px solid var(--border); }
.trend-up { color: var(--crit); font-weight: 700; }
.trend-down { color: var(--minor); font-weight: 700; }

/* ── Toolbar ── */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.view-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
.vt-btn { background: transparent; border: none; color: var(--text-dim); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 4px; }
.vt-btn.active { background: var(--surface2); color: var(--text); }
.search { flex: 1; min-width: 180px; max-width: 320px; position: relative; }
.search input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-input); border-radius: 6px; color: var(--text); padding: 7px 10px 7px 30px; font-size: 12.5px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.search::before { content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 15px; }
.filter-select { background: var(--bg-input); border: 1px solid var(--border-input); color: var(--text-dim); border-radius: 6px; padding: 6px 9px; font-size: 12px; font-weight: 600; outline: none; }
.filter-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.spacer { flex: 1; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ── Cluster cards ── */
.cluster { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; transition: background .13s, border-color .13s; }
.cluster:hover { background: var(--surface-hover); }
.cluster.open { border-color: var(--accent); background: var(--surface); }
.cluster-head { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; cursor: pointer; user-select: none; }
.chev { color: var(--text-faint); font-size: 12px; transition: transform .18s; text-align: center; }
.cluster.open .chev { transform: rotate(90deg); color: var(--accent); }
.c-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.c-name { font-weight: 600; font-size: 15px; }
.c-name .count-badge { color: var(--accent); font-weight: 700; }
.c-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--pill-bg); color: var(--pill-text); border: 1px solid var(--border); white-space: nowrap; }
.tag.growth { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.tag.sys { color: var(--accent); }
.c-right { display: flex; align-items: center; gap: 10px; }
.sev { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; letter-spacing: .04em; }
.sev.Critical { background: var(--crit-bg); color: var(--crit); border: 1px solid rgba(240,82,107,.35); }
.sev.Major { background: var(--major-bg); color: var(--major); border: 1px solid rgba(232,162,61,.35); }
.sev.Minor { background: var(--minor-bg); color: var(--minor); }
.sev.Cosmetic { background: var(--cosm-bg); color: var(--cosm); }
.c-body { border-top: 1px solid var(--border); display: none; }
.cluster.open .c-body { display: block; }
.c-summary { padding: 12px 16px 4px; color: var(--text-dim); font-size: 12.5px; }
.c-actions { display: flex; gap: 8px; padding: 10px 16px 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12px; font-weight: 600; padding: 6px 13px; border-radius: 7px; transition: all .13s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent-dim); border-color: transparent; color: var(--accent); }
.btn.primary:hover { background: var(--accent); color: #fff; }
.btn.danger:hover { border-color: var(--crit); color: var(--crit); }
.btn.sm { padding: 4px 9px; font-size: 11px; }

/* ticket rows */
.t-rows { border-top: 1px solid var(--border); }
.t-row { display: grid; grid-template-columns: 86px 1fr auto; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); transition: background .12s; cursor: pointer; }
.t-row:last-child { border-bottom: none; }
.t-row:hover { background: var(--surface-hover); }
.t-row.expanded { background: var(--surface-hover); border-bottom-color: var(--accent); }
.t-detail { display: none; grid-column: 1 / -1; padding: 10px 0; }
.t-row.expanded + .t-detail { display: block; }
.t-detail-inner { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; font-size: 12.5px; line-height: 1.6; }
.t-detail-inner .dd-row { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; padding: 3px 0; border-bottom: 1px solid var(--border); }
.t-detail-inner .dd-row:last-child { border-bottom: none; }
.t-detail-inner .dd-label { color: var(--text-faint); font-weight: 600; font-size: 11.5px; }
.t-detail-inner .dd-value { color: var(--text); word-break: break-word; }
.t-detail-inner .dd-value code { font-family: ui-monospace,monospace; font-size: 11.5px; color: var(--accent); background: var(--accent-dim); padding: 1px 5px; border-radius: 3px; }
.t-detail-inner .dd-value .fm-badge { display: inline-block; background: var(--major-bg); color: var(--major); font-weight: 700; padding: 1px 7px; border-radius: 4px; font-size: 11px; }
.t-detail-inner .dd-value .conf-high { color: var(--minor); font-weight: 700; }
.t-detail-inner .dd-value .conf-medium { color: var(--gold); font-weight: 700; }
.t-detail-inner .dd-value .conf-low { color: var(--crit); font-weight: 700; }
.t-detail-loading { padding: 20px; text-align: center; color: var(--text-faint); }
.t-id { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--text-faint); }
.t-main { min-width: 0; }
.t-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-meta { font-size: 11px; color: var(--text-faint); margin-top: 1px; display: flex; gap: 8px; flex-wrap: wrap; }
.t-right { display: flex; align-items: center; gap: 8px; }
.sim { font-size: 10.5px; font-weight: 700; color: var(--minor); background: var(--minor-bg); padding: 2px 7px; border-radius: 4px; }
.mini-sev { width: 8px; height: 8px; border-radius: 50%; }
.mini-sev.Critical { background: var(--crit); } .mini-sev.Major { background: var(--major); }
.mini-sev.Minor { background: var(--minor); } .mini-sev.Cosmetic { background: var(--cosm); }
.x-btn { background: transparent; border: none; color: var(--text-faint); font-size: 13px; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: all .13s; }
.t-row:hover .x-btn { opacity: 1; }
.x-btn:hover { color: var(--crit); background: var(--crit-bg); }

/* individuals */
.ind-section { margin-top: 24px; }
.ind-head { font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.ind-head .line { flex: 1; height: 1px; background: var(--border); }
.ind-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* flat view */
.flat-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* ── Shift lead panels ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; }
.panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.panel-title .cnt { background: var(--major-bg); color: var(--major); font-size: 10.5px; padding: 1px 7px; border-radius: 999px; }
.review-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.review-row:last-child { border-bottom: none; }
.review-row .q { flex: 1; min-width: 0; }
.review-row .q .nm { font-weight: 600; }
.review-row .q .rs { font-size: 11px; color: var(--text-faint); }
.team-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.team-row:last-child { border-bottom: none; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
.bar-wrap { flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar { height: 100%; border-radius: 3px; background: var(--accent); }
.load-num { font-size: 11.5px; color: var(--text-dim); font-weight: 600; min-width: 46px; text-align: right; }

/* ── Manager view ── */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
@media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2,1fr); } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 17px; }
.stat .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-bottom: 6px; }
.stat .val { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.stat .delta { font-size: 11.5px; margin-top: 3px; font-weight: 600; }
.stat .delta.up { color: var(--crit); } .stat .delta.down { color: var(--minor); } .stat .delta.flat { color: var(--text-faint); }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.lb-row:last-child { border-bottom: none; }
.lb-rank { width: 22px; height: 22px; border-radius: 6px; background: var(--surface2); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
.lb-rank.hot { background: var(--crit-bg); color: var(--crit); }
.lb-name { flex: 1; min-width: 0; font-weight: 600; }
.lb-name .sub { display: block; font-weight: 400; font-size: 11px; color: var(--text-faint); }
.lb-num { font-weight: 700; font-size: 14px; }
.lb-num small { font-weight: 400; font-size: 10.5px; color: var(--text-faint); display: block; text-align: right; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
.spark i { width: 7px; background: var(--surface2); border-radius: 2px 2px 0 0; display: block; }
.spark i.cur { background: var(--accent); }
.sysbar-row { display: grid; grid-template-columns: 130px 1fr 46px; gap: 10px; align-items: center; padding: 6px 0; font-size: 12.5px; }
.sysbar-row .nm { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sysbar-row .n { text-align: right; font-weight: 700; }

/* toast */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 9px; font-size: 13px; font-weight: 600; transition: transform .25s ease; z-index: 100; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#toast.show { transform: translateX(-50%) translateY(0); }

.empty { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 13px; }
.loading { padding: 50px 0; text-align: center; color: var(--text-dim); }
.loading .spin { display: inline-block; animation: spin 1s linear infinite; font-size: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img src="elm-logo-white.svg" alt="ELM" class="logo-img"> <span class="logo-name">Service Ops</span></div>
    <div class="role-switch" id="roleSwitch">
      <button class="role-btn active" data-role="employee">My Queue</button>
      <button class="role-btn" data-role="lead">Shift Lead</button>
      <button class="role-btn" data-role="manager">Manager</button>
    </div>
    <div class="topbar-right">
      <a class="app-link" href="write-incident.html">+ New Incident</a>
      <span id="lastRunTimer" style="font-size:11.5px;color:var(--text-faint)"></span>
      <span id="connStatus"><span class="live-dot" id="connDot"></span> <span id="connText">offline</span></span>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- ══════════ EMPLOYEE VIEW ══════════ -->
  <div class="view active" id="view-employee">
    <div class="headline"><h1 id="empHeadline">—</h1></div>
    <div class="subline" id="empSubline">—</div>
    <div class="toolbar">
      <div class="view-toggle">
        <button class="vt-btn active" id="vtGrouped">Grouped</button>
        <button class="vt-btn" id="vtFlat">Flat list</button>
      </div>
      <div class="search"><input id="empSearch" placeholder="Search tickets or incident ID…"></div>
      <select class="filter-select" id="empSevFilter">
        <option value="">All severities</option><option>Critical</option><option>Major</option><option>Minor</option><option>Cosmetic</option>
      </select>
      <span style="color:var(--text-faint);font-size:12px">|</span>
      <select class="filter-select" id="empGroupFilter">
        <option value="my">My Group (App Support)</option>
        <option value="all">All groups</option>
        <option>Payments</option>
        <option>Infrastructure</option>
        <option>Operations</option>
      </select>
      <div class="spacer"></div>
      <span style="font-size:11.5px;color:var(--text-faint)" id="empCount"></span>
    </div>
    <div id="empClusters"></div>
    <div id="empFlat" style="display:none"></div>
  </div>

  <!-- ══════════ SHIFT LEAD VIEW ══════════ -->
  <div class="view" id="view-lead">
    <div class="headline"><h1 id="leadHeadline">—</h1></div>
    <div class="subline" id="leadSubline">—</div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">⚠ Needs human review <span class="cnt" id="reviewCnt">0</span></div>
        <div id="reviewList"></div>
      </div>
      <div class="panel">
        <div class="panel-title">👥 Team load</div>
        <div id="teamLoad"></div>
      </div>
    </div>
    <div class="toolbar">
      <span style="font-size:13px;font-weight:600">Team clusters</span>
      <span style="font-size:11.5px;color:var(--text-faint)">ranked by severity × growth</span>
      <div class="spacer"></div>
      <select class="filter-select" id="leadTeamFilter">
        <option value="">All teams</option><option>App Support</option><option>Payments</option><option>Infrastructure</option><option>Operations</option>
      </select>
    </div>
    <div id="leadClusters"></div>
  </div>

  <!-- ══════════ MANAGER VIEW ══════════ -->
  <div class="view" id="view-manager">
    <div class="headline"><h1 id="mgrHeadline">—</h1></div>
    <div class="subline" id="mgrSubline">—</div>
    <div class="stat-grid" id="mgrStats"></div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">🔁 Recurring patterns — last 4 weeks</div>
        <div id="mgrRecurring"></div>
      </div>
      <div class="panel">
        <div class="panel-title">🖥 Tickets per system — this week</div>
        <div id="mgrSystems"></div>
      </div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">⏱ Cluster resolution time</div>
        <div id="mgrResolution"></div>
      </div>
      <div class="panel">
        <div class="panel-title">📉 Deflection</div>
        <div id="mgrDeflection"></div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="app.js?v=13"></script>
</body>
</html>
