server {
    listen       8082;
    server_name  _;

    # Dashboard static files
    root   /usr/share/nginx/html;
    index  index.html;

    # Never cache the HTML shell — the dashboard is updated frequently and
    # inline CSS lives in index.html. Browsers must revalidate on every load
    # so theme/logic changes appear without a manual hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy ALL API/backend paths to the FastAPI service
    # Matches: /api/*, /admin/*, /health, /classify, /incidents, /import, /reports, /docs, /openapi.json
    location ~ ^/(api/|admin/|health|ready|status|classify|incidents|import|reports|docs|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}
