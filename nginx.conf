server {
    listen       8082;
    server_name  _;

    # Dashboard static files
    root   /usr/share/nginx/html;
    index  index.html;

    # Never cache the HTML shell — the dashboard is updated frequently and
    # inline CSS lives in index.html. Browsers must revalidate on every load
    # so theme/logic changes appear without a manual hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Attachment OCR (write-incident page) → the OCR service.
    location = /ocr {
        proxy_pass http://ocr:8001/ocr;
        proxy_read_timeout 300s;
        client_max_body_size 20m;   # the OCR server's own upload cap
    }

    # Proxy ALL API/backend paths to the FastAPI service. Keep this list in
    # sync with the chart's copy (ai-classifier/templates/frontend.yaml) —
    # an unlisted path falls through to index.html and fails as a JSON
    # parse error in the browser.
    location ~ ^/(api/|admin/|health|ready|status|classify|incidents|all-incidents|import|reports|review-queue|cluster-proposals|cluster/|clusters|taxonomy-gaps|test/|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}
