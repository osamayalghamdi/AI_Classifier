[project]
name = "ai-classification"
version = "0.2.0"
description = "AI-powered structured incident classification with semantic similarity"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "litellm>=1.60",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "pillow>=12.2.0",
    "networkx>=3.6.1",
    "scikit-learn>=1.8.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
include = ["ai_classification*"]
