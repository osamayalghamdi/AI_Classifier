[project]
name = "ai-classification"
version = "0.1.0"
description = "AI-powered structured incident classification API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "litellm>=1.60",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]
